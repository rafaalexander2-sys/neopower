name: WordPress Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'O que executar'
        required: true
        default: 'kit'
        type: choice
        options:
          - all
          - home
          - quem-somos
          - servicos
          - projetos
          - contato
          - politicas
          - setup-front-page
          - kit
          - ping
          - diagnose

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Criar .env.wp
        run: |
          echo "WP_URL=${{ secrets.WP_URL }}" >> .env.wp
          echo "WP_USER=${{ secrets.WP_USER }}" >> .env.wp
          echo "WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}" >> .env.wp

      - name: Ping WordPress REST API
        if: ${{ inputs.action == 'ping' }}
        run: |
          echo "Testando conectividade com ${{ secrets.WP_URL }}"
          curl -v --max-time 10 "${{ secrets.WP_URL }}/wp-json/" 2>&1 | head -60

      - name: Configurar Kit Global
        if: ${{ inputs.action == 'kit' }}
        run: node --env-file=.env.wp scripts/wp/setup-kit.mjs

      - name: Configurar página inicial
        if: ${{ inputs.action == 'setup-front-page' }}
        run: node --env-file=.env.wp scripts/wp/setup-front-page.mjs

      - name: Diagnóstico do WordPress
        if: ${{ inputs.action == 'diagnose' }}
        run: node --env-file=.env.wp scripts/wp/diagnose.mjs

      - name: Publicar todas as páginas
        if: ${{ inputs.action == 'all' }}
        run: |
          for page in home quem-somos servicos projetos contato politicas; do
            echo "▶  Publicando $page..."
            node --env-file=.env.wp scripts/wp/pages/$page.mjs
          done

      - name: Publicar página
        if: ${{ inputs.action != 'kit' && inputs.action != 'ping' && inputs.action != 'setup-front-page' && inputs.action != 'all' && inputs.action != 'diagnose' }}
        run: node --env-file=.env.wp scripts/wp/pages/${{ inputs.action }}.mjs
